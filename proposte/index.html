<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Due direzioni · La Compagnia degli Anelli</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#e5e7eb;font-family:system-ui,sans-serif;color:#182130}button,a{font:inherit}button{cursor:pointer}.review{min-height:72px;padding:12px 22px;background:#fff;display:flex;align-items:center;gap:24px;border-bottom:1px solid #ddd}.review__title{font-size:13px;line-height:1.45}.review__title strong{display:block}.review__title span{color:#67707d;font-size:11px}.choices,.sizes{display:flex;gap:4px;padding:4px;border-radius:9px;background:#f0f1f3}.choices button,.sizes button{border:0;padding:10px 15px;border-radius:6px;background:transparent;color:#596273;font-size:12px;font-weight:650;min-height:38px}.choices button[aria-pressed=true],.sizes button[aria-pressed=true]{background:#152338;color:white}.sizes{margin-left:auto}.open{font-size:12px;color:#182130;text-underline-offset:4px}.canvas{height:calc(100dvh - 72px);display:flex;justify-content:center;overflow:auto;padding:0;transition:padding .2s}.canvas.mobile{padding:20px}.canvas iframe{border:0;background:#fff;width:100%;height:100%;display:block}.canvas.mobile iframe{width:390px;max-width:100%;box-shadow:0 10px 50px #18213025;border-radius:16px}.review button:focus-visible,a:focus-visible{outline:3px solid #997951;outline-offset:2px}@media(max-width:720px){.review{gap:8px;flex-wrap:wrap;padding:8px 12px}.review__title{display:none}.choices{flex:1}.choices button{flex:1;padding:9px 8px}.sizes{display:none}.canvas{height:calc(100dvh - 63px)}.canvas.mobile{padding:0}.canvas.mobile iframe{border-radius:0}.open{font-size:11px}}
  </style>
</head>
<body>
  <header class="review">
    <div class="review__title"><strong>La Compagnia degli Anelli</strong><span>Proposte · hero + prima sezione</span></div>
    <nav class="choices" aria-label="Scegli la proposta"><button type="button" data-page="a" aria-pressed="true">A · In sala</button><button type="button" data-page="b" aria-pressed="false">B · La Compagnia</button></nav>
    <div class="sizes" aria-label="Dimensione anteprima"><button type="button" data-size="desktop" aria-pressed="true">Desktop</button><button type="button" data-size="mobile" aria-pressed="false">Mobile</button></div>
    <a class="open" href="a.html" target="_blank" rel="noopener">Apri pagina ↗</a>
  </header>
  <main class="canvas"><iframe src="a.html" title="Proposta A · In sala" allow="autoplay; fullscreen"></iframe></main>
  <script>
    const frame=document.querySelector('iframe');
    document.querySelectorAll('[data-page]').forEach(button=>button.addEventListener('click',()=>{
      document.querySelectorAll('[data-page]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
      frame.src=button.dataset.page+'.html';frame.title='Proposta '+button.textContent;
      document.querySelector('.open').href=frame.src;
    }));
    document.querySelectorAll('[data-size]').forEach(button=>button.addEventListener('click',()=>{
      document.querySelectorAll('[data-size]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
      document.querySelector('.canvas').classList.toggle('mobile',button.dataset.size==='mobile');
    }));
  </script>
</body>
</html>
